[project]
name = "aiday-hackathon"
version = "0.1.0"
description = "Seeded customer support hackathon event server and deterministic grader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
aiday = "aiday.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

